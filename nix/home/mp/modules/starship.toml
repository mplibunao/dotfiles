# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""


# Sets user-defined palette
# Palettes must be defined _after_ this line
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# Starship modules
[character]
# Note the use of Catppuccin color 'peach'
success_symbol = "[[󰄛](green) ❯](peach)"
error_symbol = "[[󰄛](red) ❯](peach)"
vimcmd_symbol = "[󰄛 ❮](subtext1)" # For use with zsh-vi-mode
vimcmd_replace_one_symbol = "[󰄛 r](yellow)"  # Replace one
vimcmd_replace_symbol = "[󰄛 R](peach)"      # Replace mode
vimcmd_visual_symbol = "[󰄛 v](lavender)"       # Visual mode

[git_branch]
style = "bold mauve"
symbol = '🌱 '
truncation_length = 9
truncation_symbol = ''
ignore_branches = ['master', 'main']

[git_status]
disabled = true
conflicted = '🏳'
ahead = '🏎💨'
behind = '😰'
diverged = '😵'
up_to_date = '✓'
untracked = '🤷'
stashed = '📦'
modified = '📝'
staged = '[++\($count\)](green)'
renamed = '👅'
deleted = '🗑'

[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
style = "bold yellow"
rebase = '[🔄 REBASE](bold peach)'
merge = '[🔀 MERGE](bold lavender)'
revert = '[⏪ REVERT](bold flamingo)'
cherry_pick = '[🍒 PICK](bold red)'
bisect = '[🔍 BISECT](bold sapphire)'
am = '[📧 PATCH](bold teal)'
am_or_rebase = '[📧/🔄](bold mauve)'

[directory]
truncation_length = 4
style = "bold lavender"
home_symbol = "󰋜 " 

[cmd_duration]
min_time = 500
show_milliseconds = true
style = "yellow"

