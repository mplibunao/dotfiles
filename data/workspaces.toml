# Workspace Registry - Single Source of Truth
#
# Location: inside the flake, so evaluation stays pure
# Consumed by: Nix (builtins.fromTOML in modules/aerospace/default.nix)
#
# This registry defines canonical workspace names. All references to lettered
# workspaces in aerospace.toml and default.nix should use
# values from this file.

[workspaces]
terminal = "1"
browser = "3"
repoPrompt = "4"
codex = "6"
claude = "7"
obsidian = "O"
music = "M"
slack = "S"
discord = "D"
mix = "X"  # Exception workspace - no auto-assignment rules (for mixed layouts)
internal = "I"  # Ad-hoc scratch pinned to built-in/internal display - no auto-assignment rules
