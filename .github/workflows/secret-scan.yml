name: Secret Scan

# No path or base-branch filters: every push to main, and every pull request
# that is opened, updated, or reopened, triggers it, except that GitHub doesn't
# run pull_request workflows while the pull request has merge conflicts. The
# scan covers the history reachable from the checked-out commit and uses
# gitleaks' default rules, like the pre-push hook (.githooks/pre-push),
# including each merge commit's diff against its first parent. The logs of this
# repository are public, so --redact must stay on: it masks the detected secret
# in each printed finding. Without --verbose gitleaks prints only a count of
# findings, not where they are.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # One group per commit. GitHub keeps one pending run per group and cancels
    # the others, which would drop the scan of a commit that a later force-push
    # removes from the history.
    concurrency:
      group: ${{ github.workflow }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30

      - name: Scan the history with gitleaks
        run: >-
          nix shell --no-write-lock-file --inputs-from .
          nixpkgs#gitleaks
          --command gitleaks git --redact --verbose --no-banner
          --log-opts="--diff-merges=first-parent HEAD" .
